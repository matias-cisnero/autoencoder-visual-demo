<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decodificador Visual | Espacio Latente</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mathjs@11.8.0/lib/browser/math.min.js"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h1>Decodificador Visual</h1>

        <main class="main-layout">
            <div class="config-column">
                <div class="input-group">
                    <label>Espacio Latente (Interactivo)</label>
                    <div class="diagram-area">
                        <svg id="chart-svg"></svg>
                    </div>
                </div>
                
                <div class="inputs-grid">
                    <div class="input-group">
                        <label for="manualX">Valor Latente X</label>
                        <input type="number" id="manualX" step="0.01" placeholder="0.00">
                    </div>
                    <div class="input-group">
                        <label for="manualY">Valor Latente Y</label>
                        <input type="number" id="manualY" step="0.01" placeholder="0.00">
                    </div>
                </div>
            </div>

            <div class="display-column">
                <div class="input-group" style="height: 100%;">
                    <label>Reconstrucción Visual (5x5)</label>
                    <div class="canvas-area">
                        <div id="predictionMatrix"></div>
                        <p id="predictionPlaceholder" class="placeholder-text">Selecciona un punto para decodificar</p>
                    </div>
                </div>
            </div>

            <div class="actions">
                <button id="decodeBtn" onclick="handleDecodePrediction()">
                    <span id="decodeButtonText">Generar Decodificación</span>
                    <div id="decodeLoadingSpinner" class="spinner hidden"></div>
                </button>
            </div>

            <div class="output-area">
                <div id="resultado">Esperando entrada...</div>
                <div id="errorContainer" class="hidden">
                    <p id="errorMessage"></p>
                </div>
            </div>
        </main>

        <footer class="card-footer">
            <span>Desarrollado por <strong>Matías Cisnero</strong></span>
            <a href="https://github.com/matias-cisnero/autoencoder-intro-ia" target="_blank">Repositorio de GitHub</a>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
